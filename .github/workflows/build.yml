# Checks, Android build and an emulator screenshot on every push.
# Download the results from the run's "Artifacts" section on GitHub.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  APP_ID: com.saniyaa61.relic

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev \
            libxcursor-dev libvulkan-dev
      - run: go vet ./...
      - run: go test ./...

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install gogio
        run: go install gioui.org/cmd/gogio@v0.10.0
      - name: Build APK
        # The runner image ships the Android SDK and NDK.
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          gogio -target android -arch arm64,amd64 -minsdk 24 \
            -appid "$APP_ID" -name Relic -o relic.apk ./cmd/relic
      - uses: actions/upload-artifact@v4
        with:
          name: relic-apk
          path: relic.apk

  emulator:
    name: Run on Android emulator
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relic-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install -r relic.apk
            adb shell monkey -p ${{ env.APP_ID }} -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > screenshots/relic.png
            # Restart the app: the saved launch count must survive.
            adb shell am force-stop ${{ env.APP_ID }}
            adb shell monkey -p ${{ env.APP_ID }} -c android.intent.category.LAUNCHER 1
            sleep 10
            adb logcat -d > screenshots/logcat.txt
            # Fails the run if the app has crashed.
            adb shell pidof ${{ env.APP_ID }}
            # Fails the run unless the database was written and read back.
            grep "relic: store ok, launch 1" screenshots/logcat.txt
            grep "relic: store ok, launch 2" screenshots/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/

  ios:
    name: iOS simulator
    # gogio builds simulator apps for Intel only, so use an Intel Mac.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test store on macOS
        run: go test ./store/...
      - name: Install gogio
        run: go install gioui.org/cmd/gogio@v0.10.0
      - name: Build for the iOS simulator
        run: |
          gogio -target ios -arch amd64 -minsdk 15 \
            -appid "$APP_ID" -name Relic -o Relic.app ./cmd/relic
      - name: Install, launch twice and screenshot
        run: |
          mkdir -p screenshots
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r, xs in d.items() if "iOS" in r for x in xs if "iPhone" in x["name"]))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" Relic.app
          xcrun simctl launch --console-pty "$UDID" "$APP_ID" > screenshots/run1.txt 2>&1 &
          sleep 20
          xcrun simctl io "$UDID" screenshot screenshots/relic-ios.png
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          sleep 2
          xcrun simctl launch --console-pty "$UDID" "$APP_ID" > screenshots/run2.txt 2>&1 &
          sleep 15
          xcrun simctl terminate "$UDID" "$APP_ID" || true
          cat screenshots/run1.txt screenshots/run2.txt
          grep "relic: store ok, launch 1" screenshots/run1.txt
          grep "relic: store ok, launch 2" screenshots/run2.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: screenshots/
