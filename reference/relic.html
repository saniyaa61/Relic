</div><script>const THEMES=[
  {id:'linen',name:'Linen',lbg:'#F7F3EC',dbg:'#18140D',dot:'#C4956A',lcol:'#7A5C3A',dcol:'#D4A870'},
  {id:'midnight',name:'Midnight',lbg:'#F2EEF8',dbg:'#07050F',dot:'#9B74D4',lcol:'#5A3E9A',dcol:'#B090E8'},
  {id:'blush',name:'Blush',lbg:'#FDF0EF',dbg:'#160A09',dot:'#E8A89F',lcol:'#C4756A',dcol:'#D49088'},
  {id:'forest',name:'Forest',lbg:'#EFF4EB',dbg:'#060E06',dot:'#7AAD76',lcol:'#3D6B3A',dcol:'#7AAD76'},
  {id:'rose',name:'Rose',lbg:'#FEF0F5',dbg:'#110618',dot:'#E090B0',lcol:'#C05880',dcol:'#D890B8'},
  {id:'slate',name:'Slate',lbg:'#EEF2F7',dbg:'#060C14',dot:'#7090C0',lcol:'#3A5A8A',dcol:'#90B0E0'},
];
let cTheme='linen', cMode='light', cView='home', prevView='home';

function applyTheme(){
  if(cTheme==='custom'){
    document.body.className=`custom-${cMode}`;
  } else {
    document.body.className=`${cTheme}-${cMode}`;
  }
  save();
}
function setTheme(t){cTheme=t;applyTheme();}
function setMode(m){cMode=m;applyTheme();refreshModeIcons();}
function toggleMode(){setMode(cMode==='light'?'dark':'light');}
function refreshModeIcons(){
  document.querySelectorAll('.mode-icon-btn').forEach(btn=>{
    btn.innerHTML=cMode==='dark'?sunSVG():moonSVG();
  });
}

let logTargetId=null, logMode='session';

let logEditIndex=null;
function openLogSheet(id,mode,editIndex){
  logTargetId=id; logMode=mode||'session'; logEditIndex=(editIndex===undefined?null:editIndex);
  const e=entries.find(x=>x.id===id); if(!e)return;
  const isRewatch=logMode==='rewatch';
  const isEdit=logEditIndex!=null;
  const rewatchWord={book:'reread',podcast:'relisten',music:'relisten'}[e.type]||'rewatch';
  document.getElementById('log-sheet-title').textContent=
    isEdit?`Edit — ${e.title}`:isRewatch?`Log a ${rewatchWord} — ${e.title}`:`Log a session — ${e.title}`;
  const existing=isEdit?(isRewatch?(e.rewatches||[])[logEditIndex]:(e.sessions||[])[logEditIndex]):null;
  let body='';
  if(isRewatch){body=rewatchForm(e,existing);}
  else if(e.type==='series'||e.type==='podcast'){body=seriesLogForm(e,existing);}
  else if(e.type==='book'){body=bookLogForm(e,existing);}
  else{body=genericLogForm(e,existing);}
  document.getElementById('log-sheet-body').innerHTML=body;
  document.getElementById('log-sheet').classList.add('on');
  document.getElementById('log-ov').classList.add('on');
  if(isRewatch){requestAnimationFrame(()=>{const c=document.getElementById('rw-srow');if(c)setupRwStars(c,existing?.rating||0);});}
}
function closeLogSheet(){
  document.getElementById('log-sheet').classList.remove('on');
  document.getElementById('log-ov').classList.remove('on');
  logEditIndex=null;
}
function deleteSession(id,kind,index){
  const e=entries.find(x=>x.id===id); if(!e)return;
  const isRw=kind==='rewatch';
  const list=isRw?(e.rewatches||[]):(e.sessions||[]);
  const item=list[index]; if(!item)return;
  if(!isRw&&item.first){showToast("Your first entry can't be deleted here — edit it instead.",true);return;}
  openConfirmModal({
    title:'Delete this entry?',
    sub:"This piece of your journey will be removed. This can't be undone.",
    confirm:'Delete',
    onConfirm:()=>{
      list.splice(index,1);
      if(!isRw)recomputeProgress(e);
      save(); renderDetail(id); showToast('Entry deleted');
    }
  });
}

function confirmMarkFinished(id){
  const e=entries.find(x=>x.id===id); if(!e)return;
  openConfirmModal({
    title:'Mark as finished?',
    sub:`You've reached the end of ${e.title}. Mark it as finished?`,
    confirm:'Mark as finished',
    cancel:'Not yet',

function setEntryStatus(e,newStatus,atDate){
  const wasFinished=e.status==='finished';
  e.status=newStatus;
  if(newStatus==='finished'&&!wasFinished){
    e.finishedAt=atDate||new Date().toISOString();
  } else if(newStatus!=='finished'&&wasFinished){
    e.finishedAt=null;
  }
}
function entryReachedEnd(e){
  const pf=PROGRESS_FIELDS[e.type];
  if(!pf)return false;
  return !!(e[pf[1]]&&(e[pf[0]]||0)>=e[pf[1]]);
}
function recomputeProgress(e){
  const pf=PROGRESS_FIELDS[e.type];
  if(!pf)return;
  const sessions=getAllSessionsWithFirst(e);
  if(e.type==='book'){
    let maxTo=0;
    sessions.forEach(s=>{ if(s.to) maxTo=Math.max(maxTo,s.to); });
    e.pagesRead=maxTo;
  } else {
    let total=0;
    sessions.forEach(s=>{ total+=s.eps||0; });
    e.watchedEpisodes=e.totalEpisodes?Math.min(total,e.totalEpisodes):total;
  }
}
function maybePromptFinished(e){
  if(e.status==='finished')return;
  if(!entryReachedEnd(e))return;
  setTimeout(()=>{
    openConfirmModal({
      title:'Looks like you reached the end!',
      sub:`You've caught up with every bit of ${e.title}. Mark it as finished?`,
      confirm:'Mark as finished',
      cancel:'Not yet',
      onConfirm:()=>{ setEntryStatus(e,'finished'); save(); renderDetail(e.id); showToast('Marked as finished ✦'); }

}

function computeStreak(){
  const dateset=new Set();
  entries.forEach(e=>{
    if(e.createdAt)dateset.add(e.createdAt.slice(0,10));
    (e.sessions||[]).forEach(s=>{ if(s.date)dateset.add(s.date.slice(0,10)); });
    (e.rewatches||[]).forEach(r=>{ if(r.date)dateset.add(r.date.slice(0,10)); });
  });
  const dates=[...dateset].sort((a,b)=>b.localeCompare(a));
  if(!dates.length)return{current:0,longest:0};
  const today=new Date().toISOString().slice(0,10);
  const yesterday=new Date(Date.now()-864e5).toISOString().slice(0,10);
  let current=0,longest=0,streak=0;
  let check=dates[0]===today||dates[0]===yesterday?dates[0]:null;
  if(check){
    for(let i=0;i<dates.length;i++){
      if(i===0){streak=1;}
      else{
        const prev=new Date(dates[i-1]),cur=new Date(dates[i]);
        const diff=(prev-cur)/864e5;
        if(diff===1)streak++;
        else break;
      }
    }
    current=streak;
  }
  let run=1;
  for(let i=1;i<dates.length;i++){
    const prev=new Date(dates[i-1]),cur=new Date(dates[i]);
    if((prev-cur)/864e5===1){run++;longest=Math.max(longest,run);}
    else run=1;
  }
  longest=Math.max(longest,current,run);
  return{current,longest};
}

function getSecType(secName){
  const sec=sections.find(s=>s.name===secName);
  if(!sec)return'film';
  if(sec.type)return sec.type;
  const n=secName.toLowerCase();
  if(n.includes('podcast'))return'podcast';
  if(n.includes('reel')||n.includes('short')||n.includes('youtube')||n.includes('video')||n.includes('clip'))return'short';
  if(n.includes('music')||n.includes('album')||n.includes('song')||n.includes('concert')||n.includes('gig'))return'music';
  if(n.includes('book')||n.includes('novel')||n.includes('read'))return'book';
  if(n.includes('drama')||n.includes('series')||n.includes('show')||n.includes('tv')||n.includes('anime')||n.includes('episode'))return'series';
  return'film';
}

function deleteSection(id){
  const sec=sections.find(s=>s.id===id); if(!sec)return;
  const count=entries.filter(e=>e.section===sec.name).length;
  openConfirmModal({
    title:`Delete "${sec.name}"?`,
    sub:count?`This category holds ${count} entr${count!==1?'ies':'y'}. Deleting it removes them too — this can't be undone.`:`The category and its folders will be removed. This can't be undone.`,
    confirm:'Delete category',
    onConfirm:()=>{
      entries=entries.filter(e=>e.section!==sec.name);
      sections.splice(sections.findIndex(x=>x.id===id),1);
      if(libSection===sec.name){libSection='';libFolder=null;}
      delete topFavorites[sec.name];
      delete favoriteOrder[sec.name];
      save(); renderLibrary(); showToast('Category deleted');
    }
  });
}
function renameSection(id){
  const sec=sections.find(s=>s.id===id); if(!sec)return;
  openPromptModal({
    title:'Rename category', label:'Category name', value:sec.name, confirm:'Save',
    typeSelect:true, typeValue:sec.type||getSecType(sec.name),
    onConfirm:(name,type)=>{
      if(sec.type!==type){sec.type=type;}
      if(name!==sec.name){
        if(sections.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){showToast('You already have that category',true);return;}
        entries.forEach(e=>{if(e.section===sec.name)e.section=name;});
        if(libSection===sec.name)libSection=name;
        if(topFavorites[sec.name]){topFavorites[name]=topFavorites[sec.name];delete topFavorites[sec.name];}
        if(favoriteOrder[sec.name]){favoriteOrder[name]=favoriteOrder[sec.name];delete favoriteOrder[sec.name];}
        sec.name=name;
      }
      save(); renderLibrary(); showToast('Category updated');
    }
  });
}
function deleteFolder(secId,folderIdx){
  const sec=sections.find(s=>s.id===secId); if(!sec)return;
  const folder=sec.folders[folderIdx]; if(folder===undefined)return;
  const count=entries.filter(e=>e.section===sec.name&&e.folder===folder).length;
  openConfirmModal({
    title:`Delete "${folder}"?`,
    sub:count?`${count} entr${count!==1?'ies':'y'} will move back to Uncategorised — nothing is lost.`:`This empty folder will be removed.`,
    confirm:'Delete folder',
    onConfirm:()=>{
      entries.forEach(e=>{if(e.section===sec.name&&e.folder===folder)e.folder='';});
      sec.folders.splice(folderIdx,1);
      if(libFolder===folder)libFolder=null;
      save(); renderLibrary(); showToast('Folder deleted');
    }
  });
}
function renameFolder(secId,folderIdx){
  const sec=sections.find(s=>s.id===secId); if(!sec)return;
  const folder=sec.folders[folderIdx]; if(folder===undefined)return;
  openPromptModal({
    title:'Rename folder', label:'Folder name', value:folder, confirm:'Save',
    onConfirm:(name)=>{
      if(name===folder)return;
      if(sec.folders.some((f,i)=>i!==folderIdx&&f.toLowerCase()===name.toLowerCase())){showToast('That folder already exists',true);return;}
      entries.forEach(e=>{if(e.section===sec.name&&e.folder===folder)e.folder=name;});
      sec.folders[folderIdx]=name;
      if(libFolder===folder)libFolder=name;
      save(); renderLibrary(); showToast('Folder renamed');
    }
  });
}

function nav(v){
  if(v==='settings'){openSettingsSheet();return;}
  document.querySelectorAll('.vw').forEach(el=>el.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('.nitem').forEach(el=>el.classList.remove('active'));
  document.querySelector(`[data-n="${v}"]`)?.classList.add('active');
  document.getElementById('bnav').style.display='flex';
  prevView=cView; cView=v;
  ({home:renderHome,library:renderLibrary,digest:renderDigest,new:renderNew,favorites:renderFavorites})[v]?.();
}
function showDetail(id){
  document.querySelectorAll('.vw').forEach(el=>el.classList.remove('active'));
  document.getElementById('v-detail').classList.add('active');
  document.getElementById('bnav').style.display='none';
  prevView=cView; cView='detail'; editingId=null;
  renderDetail(id);
}
function goBack(){
  document.getElementById('bnav').style.display='flex';
  if(prevView==='detail'||prevView==='home')nav('home');
  else if(prevView==='library')nav('library');
  else nav(prevView||'home');
}

function completeOnboarding(){
  const inp=document.getElementById('onboard-name');
  if(inp&&inp.value.trim())userName=inp.value.trim();
  save();
  document.getElementById('bnav').style.display='flex';
  if(!sections.length){
    nav('home');
    setTimeout(()=>goAddCategory(),260);

    nav('home');

function ongoingCardHTML(e){
  let pct=0;
  const pf=PROGRESS_FIELDS[e.type];
  if(pf&&e[pf[1]]>0) pct=Math.round((e[pf[0]]||0)/e[pf[1]]*100);
  const r=11, circ=2*Math.PI*r, offset=circ-(pct/100)*circ;
  return `<div class="oc" onclick="showDetail('${e.id}')">

function chunkArray(arr,size){
  const out=[];
  for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));

function entryMatchesQuery(e,qLow){
  if((e.title||'').toLowerCase().includes(qLow))return true;
  if((e.review||'').toLowerCase().includes(qLow))return true;
  if((e.tags||[]).some(t=>t.toLowerCase().includes(qLow)))return true;
  if((e.section||'').toLowerCase().includes(qLow))return true;
  if((e.folder||'').toLowerCase().includes(qLow))return true;
  const schema=FIELD_SCHEMAS[e.type]||FIELD_SCHEMAS.film;
  return schema.flat().some(fd=>(e[fd.id]||'').toString().toLowerCase().includes(qLow));
}

/* ---------- CONSUMED: time-spent breakdown ---------- */
let consumedSection=null, consumedFolder=null;
let cfSearchOpen=false, cfSearchQuery='';
let crSearchOpen=false, crSearchQuery='';
const UNCAT='__uncat__';
function openConsumed(){
  document.querySelectorAll('.vw').forEach(el=>el.classList.remove('active'));
  document.getElementById('v-consumed').classList.add('active');
  document.getElementById('bnav').style.display='none';
  prevView='home'; cView='consumed';
  consumedSection=null; consumedFolder=null;
  cfSearchOpen=false; cfSearchQuery='';
  crSearchOpen=false; crSearchQuery='';
  renderConsumed();
}
function backConsumed(){
  if(consumedFolder!=null){consumedSection=null;consumedFolder=null; renderConsumed(); return;}
  goBack();
}
function renderConsumed(){
  if(consumedFolder!=null)return renderConsumedFolder();
  renderConsumedRoot();
}
function buildEntryMinsMap(){
  const m=new Map();
  entries.forEach(e=>m.set(e.id,computeTotalMinutes(e)));
  return m;
}
function categoryTotalMinutes(sectionName,minsMap){
  const get=e=>minsMap?minsMap.get(e.id):computeTotalMinutes(e);
  return entries.filter(e=>e.section===sectionName).reduce((a,e)=>a+get(e),0);
}
function folderTotalMinutes(sectionName,folderName,minsMap){
  const get=e=>minsMap?minsMap.get(e.id):computeTotalMinutes(e);
  const pool=folderName===UNCAT
    ?entries.filter(e=>e.section===sectionName&&!e.folder)
    :entries.filter(e=>e.section===sectionName&&e.folder===folderName);
  return pool.reduce((a,e)=>a+get(e),0);
}
function openConsumedFolder(id,name){
  consumedSection=id; consumedFolder=name;
  cfSearchOpen=false; cfSearchQuery='';
  renderConsumed();
}
function buildConsumedCatBlocks(minsMap){
  return sections.map(sec=>{
    const type=sec.type||getSecType(sec.name);
    const catMins=categoryTotalMinutes(sec.name,minsMap);
    if(catMins<=0)return null;
    const cards=(sec.folders||[]).map(f=>({name:f,mins:folderTotalMinutes(sec.name,f,minsMap)})).filter(f=>f.mins>0);
    const uncatMins=folderTotalMinutes(sec.name,UNCAT,minsMap);
    if(uncatMins>0)cards.push({name:UNCAT,mins:uncatMins});
    cards.sort((a,b)=>b.mins-a.mins);
    return{sec,type,catMins,cards};
  }).filter(Boolean).sort((a,b)=>b.catMins-a.catMins);
}
function consumedRootBodyHTML(catBlocks,q,minsMap){
  return catBlocks.length?catBlocks.map(cb=>`
        <div class="sec-hd" style="margin-top:20px">
          <h2>${esc(cb.sec.name)}</h2>
          <span style="font-size:12px;color:var(--accent);font-weight:600;font-family:'DM Sans',sans-serif">${formatDuration(cb.catMins)}</span>
        </div>
        ${cb.cards.map(c=>{
          const label=c.name===UNCAT?'Uncategorised':c.name;
          const folderArg=c.name===UNCAT?'UNCAT':`'${attrEsc(c.name)}'`;
          const preview=getFolderEntries(cb.sec.name,c.name).slice(0,4);
          return`<div class="mini-sec-hd">
            <h3>${esc(label)}</h3>
            <span class="msh-time">${formatDuration(c.mins)}</span>
            <a onclick="openConsumedFolder('${cb.sec.id}',${folderArg})">See all</a>
          </div>
          <div class="fav-row">${preview.map(e=>finishedCardHTML(e,minsMap?minsMap.get(e.id):computeTotalMinutes(e))).join('')}</div>`;
        }).join('')}`).join('')
    : q
      ? `<div class="empty" style="margin-top:10px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>Nothing matches &ldquo;${esc(q)}&rdquo;.</p></div>`
      : `<div class="empty" style="margin-top:10px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><p>Nothing logged yet.</p></div>`;
}
function renderCRResults(q){
  const qLow=q.toLowerCase();
  const matched=entries.filter(e=>entryMatchesQuery(e,qLow));
  return searchResultsHTML(matched,q,{body:posterRowsBody(matched,4,e=>finishedCardHTML(e,computeTotalMinutes(e)))});
}
function splitDurationParts(str){
  const m=str.match(/^([\d.]+)\s*(.*)$/);
  return m?{num:m[1],unit:m[2]}:{num:str,unit:''};
}
function crPerspective(totalMins){
  const parts=[];
  if(totalMins>=1440&&totalMins<=72*60)parts.push(`about ${(totalMins/1440).toFixed(1)} days nonstop`);
  const films=Math.round(totalMins/120);
  if(films>=1)parts.push(`like ${films} film${films!==1?'s':''} back to back`);
  return parts.join(', ');
}
function crWeeklyMinutes(){
  const now=Date.now(), wk=7*864e5;
  const arr=new Array(8).fill(0);
  const rangeStart=now-8*wk;
  entries.forEach(e=>{
    getEntryTimeEvents(e).forEach(ev=>{
      if(!ev.date)return;
      const t=new Date(ev.date).getTime();
      if(t>=rangeStart&&t<now){
        const idx=Math.floor((t-rangeStart)/wk);
        if(idx>=0&&idx<8)arr[idx]+=ev.mins;
      }
    });
  });
  return arr;
}
function crFullBodyHTML(){
  const minsMap=buildEntryMinsMap();
  const totalMins=[...minsMap.values()].reduce((a,v)=>a+v,0);
  const catBlocks=buildConsumedCatBlocks(minsMap);
  const dp=splitDurationParts(formatDuration(totalMins)||'0 min');
  const now=new Date();
  const monthMins=entries.reduce((a,e)=>a+computeMinutesInRange(e,new Date(now.getFullYear(),now.getMonth(),1),new Date(now.getFullYear(),now.getMonth()+1,1)),0);
  const persp=crPerspective(totalMins);
  const weekly=crWeeklyMinutes();
  const maxW=Math.max(...weekly,0);
  const spark=maxW>0?`<div class="consumed-spark">${weekly.map(m=>`<span style="height:${Math.max(m/maxW*100,6)}%"></span>`).join('')}</div><div class="consumed-cap">Last 8 weeks</div>`:'';
  const colors=['var(--accent)','var(--accent2)','var(--muted)','var(--border)'];
  const shown=catBlocks.slice(0,3), restMins=catBlocks.slice(3).reduce((a,c)=>a+c.catMins,0);
  const segs=shown.map(c=>({name:c.sec.name,mins:c.catMins}));
  if(restMins>0)segs.push({name:'Other',mins:restMins});
  const segTotal=segs.reduce((a,c)=>a+c.mins,0);
  const bar=segTotal>0?`<div class="consumed-seg">${segs.map((c,i)=>`<span style="width:${c.mins/segTotal*100}%;background:${colors[i]}"></span>`).join('')}</div>
        <div class="consumed-legend">${segs.map((c,i)=>`<span class="consumed-lg"><span class="consumed-dot" style="background:${colors[i]}"></span>${esc(c.name)} ${formatDuration(c.mins)}</span>`).join('')}</div>`:'';
  return `
      <div class="consumed-hero">
        <div class="consumed-hero-top">
          <div>
            <div class="consumed-hero-eye">All time, all worlds</div>
            <div class="consumed-hero-title">${dp.num}<span class="consumed-hero-unit">${esc(dp.unit)}</span></div>
          </div>
          ${monthMins>0?`<span class="consumed-hero-pill">+${formatDuration(monthMins)} this month</span>`:''}
        </div>
        ${persp?`<div class="consumed-hero-persp">${persp}</div>`:''}
        ${spark}
        ${bar}
      </div>
      ${consumedRootBodyHTML(catBlocks,'',minsMap)}`;
}
function renderConsumedRoot(){
  const catBlocks=buildConsumedCatBlocks();

  document.getElementById('v-consumed').innerHTML=`<div class="page">
    <div class="topbar">
      <button class="ibtn" onclick="crBack()" title="Back">${IC_BACK}</button>
      <div class="topbar-r">${catBlocks.length?`<button class="ibtn" onclick="toggleCRSearch()" title="Search">${IC_SEARCH}</button>`:''}</div>
    </div>
    <div class="search-bar${crSearchOpen?' open':''}" id="cr-search-bar">
      <input class="search-input" id="cr-search-input" placeholder="Search your library…" value="${esc(crSearchQuery)}" oninput="handleCRSearch(this.value)"/>
    </div>
    <div class="scroll" id="cr-scroll">${crSearchQuery?renderCRResults(crSearchQuery):crFullBodyHTML()}</div>
  </div>`;

function ensureFavoriteOrder(section){
  const list=favoriteOrder[section]=favoriteOrder[section]||[];
  const rankSet=new Set(topFavorites[section]||[]);
  // prune ids no longer valid (deleted / unfavorited / now ranked)
  for(let i=list.length-1;i>=0;i--){
    const e=entries.find(x=>x.id===list[i]);
    if(!e||!e.favorite||e.section!==section||rankSet.has(list[i]))list.splice(i,1);
  }
  // append any favourited, unranked entries in this section that aren't tracked yet (legacy/import data)
  entries.forEach(e=>{
    if(e.section===section&&e.favorite&&!rankSet.has(e.id)&&!list.includes(e.id))list.push(e.id);
  });
  return list;
}

function addTopFavorite(section,id){
  const list=topFavorites[section]=topFavorites[section]||[];
  if(list.includes(id))return;
  if(list.length>=5){showToast('Your Top 5 is full — remove one to add this.',true);return;}
  list.push(id);
  const ord=favoriteOrder[section]; if(ord){const i=ord.indexOf(id); if(i>-1)ord.splice(i,1);}
  save(); flipRenderFavorites(section);
  showToast('Added to your All-Time Top 5 ✦');
}
function removeTopFavorite(section,id){
  const list=topFavorites[section]; if(!list)return;
  const i=list.indexOf(id); if(i<0)return;
  list.splice(i,1);
  const ord=favoriteOrder[section]=favoriteOrder[section]||[];
  if(!ord.includes(id))ord.push(id); // drops back to the bottom of Favourites
  save(); flipRenderFavorites(section);
  showToast('Removed from All-Time Top 5');
}
function moveTopFavorite(section,id,dir){
  const list=topFavorites[section]; if(!list)return;
  const i=list.indexOf(id); if(i<0)return;
  const j=i+dir; if(j<0||j>=list.length)return;
  [list[i],list[j]]=[list[j],list[i]];
  save(); flipRenderFavorites(section);
}

/* Targeted update: refresh only the Top 5 grid + Favourites list (not the whole page),
   gliding cards from their old position to their new one instead of a full re-render. */
function flipRenderFavorites(section){
  const top5El=document.getElementById('top5-block');
  if(!top5El||section!==favCategory){
    // page not built yet, or the change happened on a category the user isn't currently viewing
    renderFavorites();
    return;
  }
  const firstRects={};
  top5El.querySelectorAll('.top-card').forEach(card=>{
    firstRects[card.dataset.id]=card.getBoundingClientRect();
  });
  renderTop5Block();
  renderFavsBlock();
  const newTop5El=document.getElementById('top5-block');
  newTop5El?.querySelectorAll('.top-card').forEach(card=>{
    const first=firstRects[card.dataset.id];
    if(!first)return;
    const last=card.getBoundingClientRect();
    const dx=first.left-last.left, dy=first.top-last.top;
    if(!dx&&!dy)return;
    card.style.transition='none';
    card.style.transform=`translate(${dx}px,${dy}px)`;
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        card.style.transition='transform .32s cubic-bezier(.22,.8,.22,1)';
        card.style.transform='';
      });
    });
  });
}

let digestPeriod='month';
let digestMonthOffset=0;
let digestYearOffset=0;
function setDigestPeriod(p){
  digestPeriod=p; digestMonthOffset=0; digestYearOffset=0;
  renderDigest();
}
function getDigestFloorDate(){
  let floor=firstUsedAt?new Date(firstUsedAt):new Date();
  entries.forEach(e=>{
    if(e.createdAt){ const d=new Date(e.createdAt); if(d<floor)floor=d; }
  });
  return floor;
}
function shiftDigestMonth(delta){
  const now=new Date();
  const floorMonth=(()=>{ const f=getDigestFloorDate(); return new Date(f.getFullYear(),f.getMonth(),1); })();
  const nowMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const candidate=new Date(now.getFullYear(),now.getMonth()+digestMonthOffset+delta,1);
  if(candidate>nowMonth||candidate<floorMonth)return;
  digestMonthOffset+=delta;
  renderDigest();
}
function shiftDigestYear(delta){
  const now=new Date();
  const floorYear=getDigestFloorDate().getFullYear();
  const candidate=now.getFullYear()+digestYearOffset+delta;
  if(candidate>now.getFullYear()||candidate<floorYear)return;
  digestYearOffset+=delta;
  renderDigest();
}
function getDigestRange(){
  const now=new Date();
  const floor=getDigestFloorDate();
  if(digestPeriod==='week'){
    return{start:new Date(Date.now()-7*864e5),end:now,label:'This Week'};
  }
  if(digestPeriod==='month'){
    const base=new Date(now.getFullYear(),now.getMonth()+digestMonthOffset,1);
    const start=base, end=new Date(base.getFullYear(),base.getMonth()+1,1);
    const floorMonth=new Date(floor.getFullYear(),floor.getMonth(),1);
    const nowMonth=new Date(now.getFullYear(),now.getMonth(),1);
    return{start,end,label:base.toLocaleDateString('en-GB',{month:'long',year:'numeric'}),isFuture:base>nowMonth,atFloor:base<=floorMonth,atCeiling:base>=nowMonth};
  }
  const y=now.getFullYear()+digestYearOffset;
  return{start:new Date(y,0,1),end:new Date(y+1,0,1),label:String(y),year:y,isFuture:y>now.getFullYear(),atFloor:y<=floor.getFullYear(),atCeiling:y>=now.getFullYear()};
}
function computeMinutesInRange(e,start,end){
  let total=0;
  getEntryTimeEvents(e).forEach(ev=>{
    if(!ev.date)return;
    const dt=new Date(ev.date);
    if(dt>=start&&dt<end)total+=ev.mins;
  });
  return total;
}
function pagesReadInRange(start,end){
  let total=0;
  entries.filter(e=>e.type==='book').forEach(e=>{
    getAllSessionsWithFirst(e).forEach(s=>{
      if(!s.date)return;
      const dt=new Date(s.date);
      if(dt>=start&&dt<end&&s.to!=null&&s.from!=null)total+=Math.max(0,s.to-s.from);
    });
  });
  return total;
}
function sessionsInRange(start,end){
  const list=[];
  entries.forEach(e=>{
    getAllSessionsWithFirst(e).forEach(s=>{ if(s.date&&new Date(s.date)>=start&&new Date(s.date)<end)list.push({e,s}); });
    (e.rewatches||[]).forEach(r=>{ if(r.date&&new Date(r.date)>=start&&new Date(r.date)<end)list.push({e,s:r}); });
  });
  return list;
}
function yearMonthlyMinutes(year){
  const arr=new Array(12).fill(0);
  entries.forEach(e=>{
    getEntryTimeEvents(e).forEach(ev=>{
      if(!ev.date)return;
      const dt=new Date(ev.date);
      if(dt.getFullYear()===year)arr[dt.getMonth()]+=ev.mins;
    });
  });
  return arr;
}
/* ---------- YEAR IN REVIEW CARD (image export) ---------- */
function ycCssVar(name,fallback){
  const v=getComputedStyle(document.body).getPropertyValue(name).trim();
  return v||fallback;
}
function ycRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function ycFit(ctx,text,maxW,size,minSize,fontTpl){
  let sz=size;
  ctx.font=fontTpl.replace('{s}',sz);
  while(sz>minSize&&ctx.measureText(text).width>maxW){ sz-=2; ctx.font=fontTpl.replace('{s}',sz); }
  return sz;
}
function ycWrap(ctx,text,maxW,maxLines){
  const words=String(text).split(/\s+/).filter(Boolean);
  const lines=[]; let cur='';
  words.forEach(wd=>{
    const t=cur?cur+' '+wd:wd;
    if(ctx.measureText(t).width<=maxW)cur=t;
    else{ if(cur)lines.push(cur); cur=wd; }
  });
  if(cur)lines.push(cur);
  if(lines.length>maxLines){
    lines.length=maxLines;
    lines[maxLines-1]=lines[maxLines-1]+'…';
  }
  return lines.map(l=>{
    let x=l;
    while(x.length>1&&ctx.measureText(x).width>maxW)x=x.slice(0,-2)+'…';

function computeYearCardData(year){

    const m=computeMinutesInRange(e,start,end);
    if(m>0){ minsBySection[e.section]=(minsBySection[e.section]||0)+m; totalMins+=m; }
  });
  const cats=Object.entries(minsBySection).map(([name,mins])=>({name,mins})).sort((a,b)=>b.mins-a.mins);
  const started=entries.filter(e=>inY(e.createdAt));
  const finished=entries.filter(e=>inY(e.finishedAt));
  const activeIds=new Set(started.map(e=>e.id));
  entries.forEach(e=>{
    if(getAllSessionsWithFirst(e).some(x=>inY(x.date))||(e.rewatches||[]).some(r=>inY(r.date)))activeIds.add(e.id);
  });
  const topRated=entries.filter(e=>activeIds.has(e.id)&&e.rating>0).sort((a,b)=>b.rating-a.rating).slice(0,3);
  const tagCounts={};
  started.forEach(e=>(e.tags||[]).forEach(t=>{tagCounts[t]=(tagCounts[t]||0)+1;}));
  const topFeeling=Object.entries(tagCounts).sort((a,b)=>b[1]-a[1])[0];
  return{year,totalMins,cats,started,finished,topRated,
    topFeeling:topFeeling?topFeeling[0]:null,
    monthly:yearMonthlyMinutes(year),
    hasData:totalMins>0||started.length>0||finished.length>0};
}

function moodMonths(){

function computeMoodData(){
  const months=moodMonths();
  const perTag={};
  entries.forEach(e=>{
    if(!e.createdAt||!(e.tags||[]).length)return;
    const d=new Date(e.createdAt);
    const idx=months.findIndex(m=>d>=m.start&&d<m.end);
    if(idx<0)return;
    e.tags.forEach(t=>{ (perTag[t]=perTag[t]||new Array(months.length).fill(0))[idx]++; });
  });
  const tags=Object.entries(perTag).map(([tag,counts])=>({tag,counts,total:counts.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.total-a.total||a.tag.localeCompare(b.tag));
  return{months,tags};
}
function moodInsights(data){
  const {months,tags}=data, out=[];
  if(!tags.length)return out;
  out.push(`Your most frequent feeling: <em>${esc(tags[0].tag)}</em> (${tags[0].total} ${tags[0].total===1?'entry':'entries'}).`);
  if(months.length>=4){
    const recentN=Math.min(3,Math.floor(months.length/2));
    const earlierN=months.length-recentN;
    const deltas=tags.map(t=>{
      const recent=t.counts.slice(-recentN).reduce((a,b)=>a+b,0)/recentN;
      const earlier=t.counts.slice(0,earlierN).reduce((a,b)=>a+b,0)/earlierN;
      return{tag:t.tag,delta:recent-earlier};
    }).sort((a,b)=>b.delta-a.delta);
    const up=deltas[0], down=deltas[deltas.length-1];
    if(up&&up.delta>=0.3)out.push(`Lately you're leaning toward <em>${esc(up.tag)}</em>.`);
    if(down&&down.delta<=-0.3&&down.tag!==(up&&up.tag))out.push(`<em>${esc(down.tag)}</em> has faded from your recent entries.`);
  }
  return out;
}

        <div class="dstat"><div class="dstat-v">${streak>0?'🔥'+streak:periodSessions.length||'—'}</div><div class="dstat-l">${streak>0?'Day streak':'Sessions'}</div><div class="dstat-s">${streak>0?`best: ${longestStreak} days`:'this '+digestPeriod}</div></div>
      </div>`;

  const periodEntryIds=new Set([...periodEntries.map(e=>e.id),...periodSessions.map(x=>x.e.id)]);
  const periodRated=[...entries].filter(e=>periodEntryIds.has(e.id)&&e.rating>0).sort((a,b)=>b.rating-a.rating);
  const periodBest=periodRated[0];
  const bestCard=periodBest?`<div class="dcard" style="display:flex;gap:12px;align-items:flex-start">${periodBest.poster?`<img src="${periodBest.poster}" style="width:48px;height:68px;border-radius:8px;object-fit:cover;flex-shrink:0"/>`:''}<div style="flex:1;min-width:0"><div class="dcard-eye">Best this ${digestPeriod}</div><div class="dcard-title">${esc(periodBest.title)}</div><div class="dcard-body">${periodBest.review?'"'+esc(periodBest.review.slice(0,120))+(periodBest.review.length>120?'…':'')+'"':'No review written yet.'}</div><div class="dbadge"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>${periodBest.rating} stars</div></div></div>`:'';

  let yearChart='', yearTopList='';
  if(digestPeriod==='year'){
    const monthly=yearMonthlyMinutes(range.year);
    const maxM=Math.max(...monthly,1);
    const monthAbbr=['J','F','M','A','M','J','J','A','S','O','N','D'];

            <div class="drank-title">${esc(e.title)}</div>
            <div class="drank-stars">${'★'.repeat(Math.floor(e.rating))}${e.rating%1?'½':''}</div>
          </div>
        </div>`).join('')}</div>`;
    }
  }

  const longestProgress=digestPeriod!=='year'?(()=>{
    const tracked=entries.filter(e=>PROGRESS_FIELDS[e.type]&&e.status!=='finished');
    if(!tracked.length)return null;
    return tracked.sort((a,b)=>{
      const pa=PROGRESS_FIELDS[a.type],pb=PROGRESS_FIELDS[b.type];
      const pa0=(a[pa[0]]||0),pa1=(a[pa[1]]||1),pb0=(b[pb[0]]||0),pb1=(b[pb[1]]||1);
      return(pb0/pb1)-(pa0/pa1);
    })[0];
  })():null;
  const journeyCard=longestProgress?`<div class="dcard"><div class="dcard-eye">Still going</div><div class="dcard-title">${esc(longestProgress.title)}</div><div class="dcard-body">${(()=>{const pf=PROGRESS_FIELDS[longestProgress.type];const done=longestProgress[pf[0]]||0;const total=longestProgress[pf[1]]||0;const units={book:'pages',series:'episodes',podcast:'episodes'};const unit=units[longestProgress.type]||'sessions';const pct=total?Math.round(done/total*100):0;return done+' '+unit+' in'+(total?' · '+pct+'% through':'');})()}</div></div>`:'';

  const sessionsCard=periodSessions.length&&digestPeriod!=='year'?`<div class="dcard"><div class="dcard-eye">Sessions this ${digestPeriod}</div><div class="dcard-title">${periodSessions.length} session${periodSessions.length!==1?'s':''} logged</div><div class="dcard-body">You sat down and lived inside something ${periodSessions.length} time${periodSessions.length!==1?'s':''} this ${digestPeriod}. That counts for something.</div></div>`:'';

  const navRow=digestPeriod==='month'?`<div class="dnav">
      <button class="dnav-btn${range.atFloor?' disabled':''}" onclick="shiftDigestMonth(-1)" title="Previous month"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="dnav-label">${range.label}</div>
      <button class="dnav-btn${range.atCeiling?' disabled':''}" onclick="shiftDigestMonth(1)" title="Next month"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>`:digestPeriod==='year'?`<div class="dnav">
      <button class="dnav-btn${range.atFloor?' disabled':''}" onclick="shiftDigestYear(-1)" title="Previous year"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="dnav-label">${range.label}</div>
      <button class="dnav-btn${range.atCeiling?' disabled':''}" onclick="shiftDigestYear(1)" title="Next year"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>`:'';

  document.getElementById('v-digest').innerHTML=`<div class="page">
    <div class="topbar"><div class="logo" style="display:flex;flex-direction:row;align-items:center;gap:8px"><img src="${window._RL}" alt="Relic" style="height:38px;width:auto;object-fit:contain"/><div style="display:flex;flex-direction:column;gap:0px"><span style="font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--accent);letter-spacing:.04em;line-height:1">Relic</span><span style="font-family:'Lora',serif;font-style:italic;font-size:10px;color:var(--muted);letter-spacing:.05em;line-height:1.2">your stories, preserved</span></div></div><div class="topbar-r"></div></div>
    <div class="scroll">
      <div class="digest-toggle">
        <button class="dtog-btn${digestPeriod==='week'?' on':''}" onclick="setDigestPeriod('week')">Week</button>
        <button class="dtog-btn${digestPeriod==='month'?' on':''}" onclick="setDigestPeriod('month')">Month</button>
        <button class="dtog-btn${digestPeriod==='year'?' on':''}" onclick="setDigestPeriod('year')">Year</button>
      </div>
      ${navRow}
      <div class="dhero">
        <div class="dhero-eye">${eyebrows[digestPeriod]}</div>
        <div class="dhero-title">${range.label}</div>
        <div class="dhero-body">${narrative}</div>
      </div>
      ${statGrid}
      ${digestPeriod==='year'?yearChart:''}
      ${bestCard}
      ${digestPeriod==='year'?yearTopList:''}
      ${journeyCard}
      ${sessionsCard}
      ${digestPeriod==='year'&&!range.isFuture&&(periodMins>0||periodEntries.length>0)?`<div class="dcard" onclick="openYearCard()" style="cursor:pointer;display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><div class="dcard-eye">Year in review card</div><div class="dcard-title">Share your ${range.year}</div><div class="dcard-body">Turn this year into an image you can save or send.</div></div><svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg></div>`:''}
      ${digestPeriod!=='week'?`<div class="dcard" onclick="openMoods()" style="cursor:pointer;display:flex;align-items:center;gap:12px"><div style="flex:1;min-width:0"><div class="dcard-eye">Mood trends</div><div class="dcard-title">How your feelings have shifted</div><div class="dcard-body">See which feelings keep returning, and which are fading.</div></div><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><polyline points="9 18 15 12 9 6"/></svg></div>`:''}
      <div class="dcard"><div class="dcard-eye">A note from Relic</div><div class="dcard-title">You kept something that mattered.</div><div class="dcard-body">Every entry here is a little act of remembrance. You're building a library that is entirely yours — one feeling at a time.</div></div>
      <div style="height:4px"></div>
    </div>
  </div>`;
}


const TAGS=['Emotional','Haunting','Rewatch-worthy','Quiet','Profound','Funny','Disturbing','Comforting','Life-changing','Beautiful','Slow-burn','Bittersweet','Gothic','Romantic','Devastating'];

    const allFieldIds=Object.values(FIELD_SCHEMAS).flat(2).map(fd=>fd.id);
    allFieldIds.forEach(id=>{delete f[id];});

  }

  document.getElementById('v-new').innerHTML=`<div class="page">
    <div class="topbar">

      <div class="topbar-r">
        <button class="ibtn" onclick="editingEntryId?closeEditEntry():nav('home')"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
      </div>
    </div>
    <div class="scroll"><div class="form-wrap">
      ${hasNoSections?`<div class="fsec" style="text-align:center;padding:20px">
        <p style="font-family:'Lora',serif;font-style:italic;font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:14px">You need at least one section before adding entries. Set up your library first.</p>
        <button class="add-btn" style="margin:0;width:100%" onclick="goAddCategory()">+ Create a category</button>
      </div>`:`
      <div class="fsec">
        <div class="fsec-title" style="margin-bottom:13px">${editingEntryId?'Edit this entry':'What are you preserving?'}</div>

        <div style="display:flex;gap:8px;margin-bottom:10px">
          <div style="flex:1">
            <label class="flbl">Category</label>

            </select>
          </div>
          <div id="f-folder-wrap" style="flex:1;${currentSec&&currentSec.folders.length?'':('display:none')}">
            <label class="flbl">Folder</label>
            <select class="finput" id="f-folder">
              <option value="">— No folder —</option>
              ${(currentSec?.folders||[]).map(fo=>`<option value="${fo}">${fo}</option>`).join('')}
            </select>
          </div>
        </div>

        <div class="fld"><label class="flbl">Title</label><input class="finput" id="f-title" placeholder="Title" value="${f.title}" oninput="formState.title=this.value"/></div>

        <div style="display:flex;gap:8px;align-items:flex-start">
          <div style="flex:1.2">
            <label class="flbl">Poster</label>
            <div class="upload-box" id="upload-box" onclick="document.getElementById('f-poster').click()" style="height:106px">
              ${f.poster?`<img src="${f.poster}"/>`:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><p>Upload poster</p>`}

            <div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
              <button class="status-btn${f.status==='ongoing'?' on':''}" onclick="formState.status='ongoing';this.classList.add('on');this.nextElementSibling.classList.remove('on')" style="padding:11px 0">Ongoing</button>
              <button class="status-btn${f.status==='finished'?' on':''}" onclick="formState.status='finished';this.classList.add('on');this.previousElementSibling.classList.remove('on')" style="padding:11px 0">Finished</button>
            </div>

        </div>
      </div>
      <div class="fsec">

          if(row.length===1||row[0].span==='full'){

          }
          return`<div style="display:flex;gap:8px">${row.map(fd=>`<div class="fld" style="flex:1"><label class="flbl">${fd.label}</label><input class="finput" id="f-${fd.id}" type="${fd.type||'text'}" placeholder="${fd.placeholder}" value="${f[fd.id]||''}"/></div>`).join('')}</div>`;
        }).join('')}
      </div>
      <div class="fsec">

        <div class="fsec-title">Your words</div>
        <textarea class="ftarea" id="f-review" style="min-height:140px" placeholder="How did it make you feel? What will stay with you? Write freely — this is just for you." oninput="updateWordCount(this)">${f.review||''}</textarea>
        <div id="review-count" style="text-align:right;font-size:11px;color:var(--muted);font-family:'Lora',serif;font-style:italic;margin-top:3px;padding-right:2px">${f.review?f.review.split(/\s+/).filter(Boolean).length+' words':''}</div>

        <div class="custom-tag-wrap">
          <input class="custom-tag-input" id="custom-tag-input" placeholder="Add your own tag…" maxlength="20"/>
          <button class="custom-tag-add" onclick="addCustomTag()">Add</button>
        </div>
      </div>
      <button class="save-btn" onclick="${editingEntryId?'updateEntryFromForm()':'saveEntry()'}">${editingEntryId?'Save changes →':'Preserve this memory →'}</button>
      `}
    </div></div>
  </div>`;
  setupStars();
  document.getElementById('custom-tag-input')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCustomTag();}});
}
function addCustomTag(){
  const inp=document.getElementById('custom-tag-input'); if(!inp)return;
  const val=inp.value.trim(); if(!val)return;
  if(formState.tags.length>=4){inp.value='';return;}
  if(!formState.tags.includes(val))formState.tags.push(val);
  inp.value='';
  document.getElementById('trow').innerHTML=
    TAGS.map(t=>`<button class="tbub${formState.tags.includes(t)?' on':''}" onclick="togTag('${t}')">${t}</button>`).join('')+
    formState.tags.filter(t=>!TAGS.includes(t)).map(t=>`<button class="tbub on" onclick="togTag('${t}')">${t}</button>`).join('');
}
function handlePoster(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    formState.poster=ev.target.result;
    const box=document.getElementById('upload-box');
    if(box)box.innerHTML=`<img src="${ev.target.result}"/>`;
  };
  reader.readAsDataURL(file);
}
function renderFStars(r){let h='';for(let i=1;i<=5;i++){const full=r>=i,half=!full&&r>=i-.5;h+=`<button class="sbtn${full||half?' on':''}" data-v="${i}" data-h="${i-.5}">${full?'★':half?'½':'★'}</button>`;}return h;}
function setupStars(){
  const c=document.getElementById('srow'); if(!c)return;
  c.querySelectorAll('.sbtn').forEach(b=>{
    b.addEventListener('click',function(ev){
      const rect=this.getBoundingClientRect();
      const val=(ev.clientX-rect.left)<rect.width/2?parseFloat(this.dataset.h):parseFloat(this.dataset.v);
      formState.rating=val; c.innerHTML=renderFStars(val); setupStars();
    });
  });
}
function togTag(t){
  const i=formState.tags.indexOf(t);
  if(i>-1)formState.tags.splice(i,1);
  else if(formState.tags.length<4)formState.tags.push(t);
  document.getElementById('trow').innerHTML=
    TAGS.map(tg=>`<button class="tbub${formState.tags.includes(tg)?' on':''}" onclick="togTag('${tg}')">${tg}</button>`).join('')+
    formState.tags.filter(tg=>!TAGS.includes(tg)).map(tg=>`<button class="tbub on" onclick="togTag('${tg}')">${tg}</button>`).join('');
}
function saveEntry(){
  const titleVal=document.getElementById('f-title')?.value?.trim();
  if(!titleVal){showToast('Please add a title.',true);return;}
  const sectionVal=document.getElementById('f-section')?.value||formState.section;
  const folderVal=document.getElementById('f-folder')?.value||'';
  const e={
    id:'e'+Date.now(),
    type:formState.type,
    title:titleVal,
    poster:formState.poster||'',
    rating:formState.rating,
    tags:[...formState.tags],
    review:document.getElementById('f-review')?.value||'',
    section:sectionVal,
    category:sectionVal,
    folder:folderVal,
    status:formState.status,
    createdAt:new Date().toISOString(),
    sessions:[],
    rewatches:[],
  };
  if(e.status==='finished')e.finishedAt=e.createdAt;
  const schema=FIELD_SCHEMAS[formState.type]||FIELD_SCHEMAS.film;
  schema.flat().forEach(fd=>{
    const el=document.getElementById('f-'+fd.id);
    if(!el)return;
    e[fd.id]=fd.type==='number'?(parseFloat(el.value)||0):el.value||'';
  });
  if((e.review&&e.review.trim())||PROGRESS_FIELDS[e.type]){
    const firstS={date:e.createdAt,note:e.review||'',first:true,doneAtStart:e.status==='finished',kind:'session'};
    if(e.type==='series'||e.type==='podcast')firstS.eps=e.watchedEpisodes||0;
    else if(e.type==='book'){firstS.from=0;firstS.to=e.pagesRead||0;}
    e.sessions.push(firstS);
  }
  entries.unshift(e); save();
  formState={type:getSecType(sectionVal),title:'',poster:'',rating:0,review:'',tags:[],category:sectionVal,status:'finished',_prevType:null};
  nav('home'); setTimeout(()=>showToast('Entry preserved ✦'),120);
}

/* ── DETAIL ── */
function openEditEntry(id){
  const e=entries.find(x=>x.id===id); if(!e)return;
  editingEntryId=id;
  formState={
    type:e.type, title:e.title, poster:e.poster||'', rating:e.rating||0,
    review:e.review||'', tags:[...(e.tags||[])], section:e.section, category:e.section,
    folder:e.folder||'', status:e.status,
  };
  const schema=FIELD_SCHEMAS[e.type]||FIELD_SCHEMAS.film;
  schema.flat().forEach(fd=>{ formState[fd.id]=e[fd.id]!==undefined?e[fd.id]:''; });
  document.querySelectorAll('.vw').forEach(el=>el.classList.remove('active'));
  document.getElementById('v-new').classList.add('active');
  document.getElementById('bnav').style.display='flex';
  document.querySelectorAll('.nitem').forEach(el=>el.classList.remove('active'));
  cView='new';
  renderNew();
}
function returnToDetail(id){
  document.querySelectorAll('.vw').forEach(el=>el.classList.remove('active'));
  document.getElementById('v-detail').classList.add('active');
  document.getElementById('bnav').style.display='none';
  cView='detail';
  renderDetail(id);
}
function closeEditEntry(){
  const id=editingEntryId; editingEntryId=null;
  if(id){ returnToDetail(id); } else { nav('home'); }
}
function updateEntryFromForm(){
  const e=entries.find(x=>x.id===editingEntryId); if(!e)return;
  const titleVal=document.getElementById('f-title')?.value?.trim();
  if(!titleVal){showToast('Please add a title.',true);return;}
  const sectionVal=document.getElementById('f-section')?.value||formState.section;
  const folderVal=document.getElementById('f-folder')?.value||'';
  const newType=getSecType(sectionVal);
  e.title=titleVal;
  e.poster=formState.poster||'';
  e.rating=formState.rating;
  e.tags=[...formState.tags];
  const newReview=document.getElementById('f-review')?.value||'';
  e.review=newReview;
  e.section=sectionVal; e.category=sectionVal;
  e.folder=folderVal;
  setEntryStatus(e,formState.status);
  e.type=newType;
  const schema=FIELD_SCHEMAS[newType]||FIELD_SCHEMAS.film;
  schema.flat().forEach(fd=>{
    const el=document.getElementById('f-'+fd.id);
    if(!el)return;
    e[fd.id]=fd.type==='number'?(parseFloat(el.value)||0):el.value||'';
  });
  const firstS=(e.sessions||[]).find(s=>s.first);
  if(firstS){
    firstS.note=newReview; firstS.doneAtStart=e.status==='finished';
    if(newType==='series'||newType==='podcast')firstS.eps=e.watchedEpisodes||0;
    else if(newType==='book'){firstS.from=firstS.from||0;firstS.to=e.pagesRead||0;}
  } else if((newReview.trim())||PROGRESS_FIELDS[newType]){
    if(!e.sessions)e.sessions=[];
    const ns={date:e.createdAt||new Date().toISOString(),note:newReview,first:true,doneAtStart:e.status==='finished',kind:'session'};
    if(newType==='series'||newType==='podcast')ns.eps=e.watchedEpisodes||0;
    else if(newType==='book'){ns.from=0;ns.to=e.pagesRead||0;}
    e.sessions.push(ns);
  }
  recomputeProgress(e);
  save();
  const id=editingEntryId; editingEntryId=null;
  returnToDetail(id);
  setTimeout(()=>showToast('Entry updated ✦'),120);
}

function toggleFavorite(id){
  const e=entries.find(x=>x.id===id);
  if(!e)return;
  e.favorite=!e.favorite;
  if(e.favorite&&e.section){
    const ord=favoriteOrder[e.section]=favoriteOrder[e.section]||[];
    if(!ord.includes(id)&&!(topFavorites[e.section]||[]).includes(id))ord.push(id);
  }else if(!e.favorite&&e.section){
    if(favoriteOrder[e.section])favoriteOrder[e.section]=favoriteOrder[e.section].filter(x=>x!==id);
    if(topFavorites[e.section])topFavorites[e.section]=topFavorites[e.section].filter(x=>x!==id);
  }
  save();
  renderDetail(id);
  showToast(e.favorite?'Added to favourites ♥':'Removed from favourites');
  if(e.favorite)setTimeout(()=>openRankPrompt(id),380);
}
function estimateBookSessionMins(s){
  if(s.mins)return s.mins;
  if(s.from!=null&&s.to!=null&&s.to>s.from)return(s.to-s.from)*1.5;
  return 0;
}
function getEntryTimeEvents(e){
  const events=[];
  const sessions=getAllSessionsWithFirst(e);
  if(e.type==='series'||e.type==='podcast'){
    const perEp=parseFloat(e.episodeDuration)||0;
    sessions.forEach(s=>{ if(s.eps)events.push({date:s.date,mins:s.eps*perEp}); });
    const totalEps=parseFloat(e.totalEpisodes)||0;
    (e.rewatches||[]).forEach(r=>{ if(r.full!==false)events.push({date:r.date,mins:totalEps*perEp}); });
  } else if(e.type==='book'){
    sessions.forEach(s=>{ events.push({date:s.date,mins:estimateBookSessionMins(s)}); });
  } else if(e.type==='other'){
    sessions.forEach(s=>{ if(s.mins)events.push({date:s.date,mins:s.mins}); });
  } else if(e.type==='film'||e.type==='short'){
    const dur=parseFloat(e.duration)||0;
    events.push({date:e.createdAt,mins:dur});
    (e.rewatches||[]).forEach(r=>{ events.push({date:r.date,mins:dur}); });
  }
  return events;
}
function computeTotalMinutes(e){
  return getEntryTimeEvents(e).reduce((a,ev)=>a+ev.mins,0);
}
function formatDuration(mins){
  if(!mins||mins<=0)return'';
  if(mins<60)return`${Math.round(mins)} min`;
  const hrs=mins/60;
  if(hrs<=72)return`${hrs%1===0?hrs:hrs.toFixed(1)} hr${hrs===1?'':'s'}`;
  const days=hrs/24;
  return`${days%1===0?days:days.toFixed(1)} day${days===1?'':'s'}`;
}
function startVerb(e){
  const explicit={book:'Started reading',podcast:'Started listening',music:'Started listening',film:'Started watching',series:'Started watching',short:'Started watching'};
  if(explicit[e.type])return explicit[e.type];
  const name=((e.section||'')+' '+(e.folder||'')).toLowerCase();
  if(/listen|audio|music|podcast|song|radio/.test(name))return'Started listening';
  if(/read|book|novel|article|write|comic|manga/.test(name))return'Started reading';
  if(/watch|movie|film|show|series|video|drama|anime/.test(name))return'Started watching';
  if(/play|game/.test(name))return'Started playing';
  return'Started';
}
function getAllSessionsWithFirst(e){
  if(!e.sessions)e.sessions=[];
  if(e.sessions.some(x=>x.first))return e.sessions;
  const hasReview=e.review&&e.review.trim();
  const isProgressType=!!PROGRESS_FIELDS[e.type];
  if(!hasReview&&!isProgressType)return e.sessions;
  const firstS={date:e.createdAt||new Date().toISOString(),note:e.review||'',first:true,doneAtStart:e.status==='finished',kind:'session'};
  if(e.type==='series'||e.type==='podcast'){
    const sumOthers=e.sessions.reduce((a,s)=>a+(s.eps||0),0);
    firstS.eps=Math.max(0,(e.watchedEpisodes||0)-sumOthers);
  } else if(e.type==='book'){
    firstS.from=0; firstS.to=e.pagesRead||0;
  }
  e.sessions.push(firstS);
  save();
  return e.sessions;
}
function splitSentences(text){
  return text.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
}
function scoreSentence(sent){
  let score=sent.length;
  if(/!/.test(sent))score+=20;
  const capsWords=(sent.match(/\b[A-Z]{3,}\b/g)||[]).length;
  score+=capsWords*15;
  return score;
}
function buildPowerfulQuote(e){
  const candidates=[];
  getAllSessionsWithFirst(e).forEach(s=>{
    if(s.note&&s.note.trim())splitSentences(s.note).forEach(sent=>candidates.push({text:sent,date:s.date,tag:s.first?'Started':null}));
  });
  if(!candidates.length)return null;
  let best=candidates[0],bestScore=-1;
  candidates.forEach(c=>{
    const sc=scoreSentence(c.text);
    if(sc>bestScore){bestScore=sc;best=c;}
  });
  return best;
}

function deleteEntry(id){
  const btn=event.currentTarget;
  if(!btn._confirmPending){
    btn._confirmPending=true;
    const origText=btn.textContent;
    btn.textContent='Tap again to confirm deletion';
    btn.style.borderColor='#E05555';btn.style.color='#E05555';
    setTimeout(()=>{btn._confirmPending=false;btn.textContent=origText;btn.style.borderColor='';btn.style.color='';},3000);
    return;
  }
  entries=entries.filter(e=>e.id!==id);
  Object.keys(topFavorites).forEach(sec=>{topFavorites[sec]=(topFavorites[sec]||[]).filter(rid=>rid!==id);});
  Object.keys(favoriteOrder).forEach(sec=>{favoriteOrder[sec]=(favoriteOrder[sec]||[]).filter(rid=>rid!==id);});
  save(); goBack();
  setTimeout(()=>showToast('Entry removed from your library'),120);
}

let _toastTimer=null;
function showToast(msg,isErr=false){
  const inner=document.getElementById('toast-inner');
  if(!inner)return;
  const icon=isErr
    ?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
    :'<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  inner.innerHTML=icon+msg;
  inner.classList.add('on');
  if(_toastTimer)clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>inner.classList.remove('on'),2200);
}

function applyCustomPalette(){
  const base=document.getElementById('cpc-base')?.value||'#7A5C3A';
  const accent2=document.getElementById('cpc-accent')?.value||'#C4956A';
  // Derive all palette slots using the same formulas as the built-in themes:
  // LIGHT MODE: bg/surface/border/tag/timeline = lerp(base → white) at calibrated ratios
  //             muted = lerp(base, accent2, 0.40)   text = lerp(base → black, scale 0.30)
  // DARK MODE:  bg/surface/card/border/tag/timeline = lerp(base → black) at calibrated ratios
  //             muted = lerp(base, accent2, 0.70)   text = lerp(base → white, 0.88)
  //             accent in dark = accent2 (lighter hue), accent2 in dark = base brightened
  const lw=(h,r)=>colorLerp(h,'#FFFFFF',r); // lerp toward white
  const lb=(h,r)=>colorLerp(h,'#000000',r); // lerp toward black
  // Light mode
  const lBg    =lw(base,0.923);
  const lSurf  =lw(base,0.959);
  const lBorder=lw(base,0.758);
  const lTag   =lw(base,0.841);
  const lTl    =lw(base,0.883);
  const lText  =lb(base,0.700);
  const lMuted =colorLerp(base,accent2,0.40);
  // Dark mode
  const dBg    =lb(base,0.894);
  const dSurf  =lb(base,0.814);
  const dCard  =lb(base,0.731);
  const dBorder=lb(base,0.573);
  const dTag   =lb(base,0.825);
  const dTl    =lb(base,0.802);
  const dText  =lw(base,0.879);
  const dMuted =colorLerp(base,accent2,0.70);
  // In dark mode, accent becomes the lighter accent2 color; accent2 becomes the base
  const dAccent =accent2;
  const dAccent2=base;
  let el=document.getElementById('custom-palette-style');
  if(!el){el=document.createElement('style');el.id='custom-palette-style';document.head.appendChild(el);}
  // accent2 (user's accent color) drives buttons/wordmark/numbers/nav — like the screenshot
  // base drives backgrounds/surfaces only (already baked into bg/surface/border/tag vars)
  el.textContent=`body.custom-light{--bg:${lBg};--surface:${lSurf};--card:#FFFFFF;--text:${lText};--muted:${lMuted};--accent:${accent2};--accent2:${base};--border:${lBorder};--tag:${lTag};--btn-text:${isColorDark(accent2)?'#FFFFFF':'#1A1A1A'};--timeline:${lTl}}body.custom-dark{--bg:${dBg};--surface:${dSurf};--card:${dCard};--text:${dText};--muted:${dMuted};--accent:${dAccent};--accent2:${dAccent2};--border:${dBorder};--tag:${dTag};--btn-text:${dBg};--timeline:${dTl}}`;
  customBase=base; customAccent2=accent2;
  cTheme='custom';
  document.body.className=`custom-${cMode}`;
  save();
  showToast('Custom palette applied ✦');
}

let customBase='', customAccent2='';
function hexToRgb(hex){
  const h=hex.replace('#','');
  const full=h.length===3?h.split('').map(c=>c+c).join(''):h;
  return[parseInt(full.slice(0,2),16),parseInt(full.slice(2,4),16),parseInt(full.slice(4,6),16)];
}
function rgbToHexStr(r,g,b){return'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');}
function colorLerp(hexA,hexB,t){
  const [ar,ag,ab]=hexToRgb(hexA),[br,bg2,bb]=hexToRgb(hexB);
  return rgbToHexStr(ar+(br-ar)*t,ag+(bg2-ag)*t,ab+(bb-ab)*t);
}
function isColorDark(hex){const [r,g,b]=hexToRgb(hex);return(r*299+g*587+b*114)/1000<128;}

function updateWordCount(el){
  const words=el.value.split(/\s+/).filter(Boolean).length;
  const counter=document.getElementById('review-count');
  if(counter)counter.textContent=words>0?words+' word'+(words!==1?'s':''):'';
}

function exportArchive(){
  const data={userName,theme:cTheme,customBase,customAccent:customAccent2,sections,entries,topFavorites,favoriteOrder,createdAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='relic-archive.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('Archive exported.');
}

function importArchive(ev){
  const file=ev.target.files[0];
  if(!file)return;
  if(!confirm('Import this archive? Your current data will be replaced.'))return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.entries)entries=data.entries;
      if(data.sections)sections=data.sections;
      if(data.topFavorites)topFavorites=data.topFavorites;
      if(data.favoriteOrder)favoriteOrder=data.favoriteOrder;
      if(data.userName)userName=data.userName;
      if(data.theme)theme=data.theme;
      if(data.customBase)customBase=data.customBase;
      if(data.customAccent)customAccent=data.customAccent;
      save(); applyTheme(); renderSettingsPage();
      showToast('Archive imported.');
    }catch{showToast('Could not read that file.');}
  };
  reader.readAsText(file);
}

function boot(){
  setTimeout(()=>{
    const s=document.getElementById('splash');
    if(s){s.classList.add('fade');setTimeout(()=>s.remove(),900);}
  },1600);

  load();
  if(!firstUsedAt){ firstUsedAt=new Date().toISOString(); save(); }
  applyTheme();
  if(!entries.length&&!sections.length&&!userName){
    showOnboarding();
  } else {
    renderHome();
  }
}
(function(){
  let startX=0, startY=0, tracking=false;
  document.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    if(t.clientX<28){tracking=true;startX=t.clientX;startY=t.clientY;}
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!tracking)return;
    const dx=e.touches[0].clientX-startX;
    const dy=Math.abs(e.touches[0].clientY-startY);
    if(dx>60&&dy<40){
      tracking=false;
      if(cView==='detail')goBack();
    }
  },{passive:true});
  document.addEventListener('touchend',()=>{tracking=false;},{passive:true});
})();

boot();</script></body>
